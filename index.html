(function () {
  var d = document.documentElement, g = function (k) { try { return JSON.parse(localStorage.getItem('ade.' + k)); } catch (e) { return null; } };
  var th = g('theme');
  if (th !== 'light' && th !== 'dark') th = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  d.setAttribute('data-theme', th);
  var m = g('motion'), os = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (m === 'reduce' || (m !== 'full' && os)) d.classList.add('reduced-motion');
  if (m === 'full') d.classList.add('motion-full');
})();
